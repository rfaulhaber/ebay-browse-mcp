[package]
name = "ebay-browse-mcp"
version = "0.1.0"
edition = "2024"
description = "Model Context Protocol server exposing eBay's Buy Browse API"
license = "MIT"
repository = "https://github.com/ryf/ebay-browse-mcp"

[dependencies]
base64 = "0.23"
jiff = { version = "0.2", features = ["serde"] }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = [
  "form",
  "gzip",
  "http2",
  "json",
  "query",
  "rustls",
] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
disallowed_types = "deny"
disallowed_methods = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[package.metadata.release]
allow-branch = ["main"]
sign-commit = true
sign-tag = true
push-remote = "origin"
tag-prefix = "v"
tag-name = "{{prefix}}{{version}}"
publish = true
